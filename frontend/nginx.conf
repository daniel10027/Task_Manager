server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets for faster delivery.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Cache hashed build assets aggressively; index.html is revalidated every load.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API calls to the backend service (docker-compose network alias
    # "backend"). This lets the built app call a relative `/api` path when
    # served by nginx, so no build-time VITE_API_URL is required for the
    # docker-compose setup. Standalone deployments (e.g. Cloud Run) instead
    # bake an absolute VITE_API_URL into the bundle at build time and never
    # hit this proxy — see Dockerfile / .env.example.
    #
    # The upstream is set via a variable (with Docker's embedded DNS as
    # resolver) rather than a bare proxy_pass hostname, so nginx resolves it
    # lazily per-request instead of failing to start when "backend" isn't on
    # the network (e.g. this image run standalone, without docker-compose).
    resolver 127.0.0.11 valid=30s;

    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: let React Router handle client-side routes.
    location / {
        try_files $uri /index.html;
    }
}
