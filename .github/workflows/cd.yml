name: CD — Docker build & Cloud Run deploy

# Builds backend + frontend Docker images on every push to main.
# Push to GCP Artifact Registry and deploy to Cloud Run only when the
# required GCP secrets are configured on the repo — otherwise those jobs
# report a clear skip instead of failing, so the pipeline stays usable
# before a real GCP project is wired up. See README.md "Déploiement GCP".
#
# Required repo secrets to activate deployment:
#   GCP_PROJECT_ID   - GCP project id
#   GCP_SA_KEY       - JSON key of a service account with
#                       roles/artifactregistry.writer + roles/run.admin + roles/iam.serviceAccountUser
#   GCP_REGION       - e.g. europe-west1 (optional, defaults below)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/cd.yml"
  workflow_dispatch: {}

env:
  GCP_REGION: ${{ secrets.GCP_REGION || 'europe-west1' }}
  GAR_REPOSITORY: taskmanager
  BACKEND_IMAGE_NAME: taskmanager-backend
  FRONTEND_IMAGE_NAME: taskmanager-frontend

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.GCP_PROJECT_ID }}" ] && [ -n "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GCP_PROJECT_ID / GCP_SA_KEY secrets are not set — building images only, skipping push & deploy. See README.md for setup."
          fi

  build-images:
    needs: check-secrets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.name }} image
        run: docker build -t ${{ matrix.name }}:ci -f ${{ matrix.context }}/Dockerfile ${{ matrix.context }}

  push-and-deploy:
    needs: [check-secrets, build-images]
    if: needs.check-secrets.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build & push backend
        run: |
          IMAGE=${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          docker build -t "$IMAGE" -f backend/Dockerfile backend
          docker push "$IMAGE"
          echo "BACKEND_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy taskmanager-backend \
            --image "$BACKEND_IMAGE" \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "SPRING_PROFILES_ACTIVE=docker,DB_HOST=${{ secrets.DB_HOST }},DB_NAME=${{ secrets.DB_NAME }},DB_USER=${{ secrets.DB_USER }},DB_PASSWORD=${{ secrets.DB_PASSWORD }},APP_JWT_SECRET=${{ secrets.APP_JWT_SECRET }}"

      - name: Get backend URL
        id: backend_url
        run: |
          URL=$(gcloud run services describe taskmanager-backend --project ${{ secrets.GCP_PROJECT_ID }} --region ${{ env.GCP_REGION }} --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Build & push frontend (baked with backend URL)
        run: |
          IMAGE=${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
          docker build -t "$IMAGE" --build-arg VITE_API_URL=${{ steps.backend_url.outputs.url }} -f frontend/Dockerfile frontend
          docker push "$IMAGE"
          echo "FRONTEND_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy taskmanager-frontend \
            --image "$FRONTEND_IMAGE" \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 80

      - name: Summary
        run: |
          echo "### Deployed to Cloud Run" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend: ${{ steps.backend_url.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
